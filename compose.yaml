services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: greener
      POSTGRES_PASSWORD: greener_dev
      POSTGRES_DB: greener
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U greener -d greener"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: